  </g>

  <!-- Legend -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#16191d" font-size="15">
    <rect x="40" y="690" width="40" height="26" rx="5" fill="#fbfbfa" stroke="#d0d4da" stroke-width="1.5"/>
    <rect x="40" y="694" width="3" height="18" fill="#0d7a57"/>
    <text x="92" y="708">accent = my part</text>
    <line x1="290" y1="703" x2="334" y2="703" stroke="#0d7a57" stroke-width="2.5" marker-end="url(#ah-accent)"/>
    <text x="346" y="708">lightning strike path</text>
