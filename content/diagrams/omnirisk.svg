    <rect x="40" y="255" width="200" height="95" rx="10"/>
    <rect x="330" y="100" width="230" height="90" rx="10"/>
    <rect x="620" y="100" width="250" height="90" rx="10"/>
    <rect x="400" y="250" width="380" height="100" rx="10"/>
    <rect x="960" y="100" width="200" height="90" rx="10"/>
    <rect x="960" y="260" width="200" height="90" rx="10"/>
    <rect x="80" y="505" width="220" height="90" rx="10"/>
    <rect x="470" y="495" width="250" height="110" rx="10"/>
    <rect x="800" y="505" width="200" height="90" rx="10"/>
    <rect x="1030" y="505" width="110" height="90" rx="10"/>
  </g>

  <!-- Accent bars: my part -->
  <g fill="#0d7a57">
    <rect x="330" y="110" width="3" height="70"/>
    <rect x="620" y="110" width="3" height="70"/>
    <rect x="80" y="515" width="3" height="70"/>
    <rect x="470" y="505" width="3" height="90"/>
    <rect x="800" y="515" width="3" height="70"/>
  </g>

  <!-- Arrows: supporting data flow -->
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ah-gray)">
    <line x1="240" y1="302" x2="400" y2="302"/>
    <line x1="445" y1="250" x2="445" y2="190"/>
    <line x1="745" y1="250" x2="745" y2="190"/>
    <path d="M400,268 H305 V145 H240" marker-start="url(#ah-gray)"/>
    <path d="M780,268 H920 V145 H960" marker-start="url(#ah-gray)"/>
    <line x1="300" y1="550" x2="470" y2="550"/>
    <line x1="720" y1="550" x2="800" y2="550"/>
  </g>

  <!-- Arrows: lightning strike path -->
  <g stroke="#0d7a57" stroke-width="2.5" fill="none" marker-end="url(#ah-accent)">
    <line x1="960" y1="320" x2="780" y2="320"/>
    <line x1="595" y1="350" x2="595" y2="495"/>
    <path d="M640,605 V630 H1085 V595"/>
  </g>

