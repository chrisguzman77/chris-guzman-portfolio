    <text x="900" y="538" font-size="19" font-weight="600">Beacon head</text>
    <text x="900" y="562" font-size="15">UNO · LCD · countdown</text>
    <text x="900" y="583" font-size="15">29-LED gauge</text>

    <text x="1085" y="540" font-size="19" font-weight="600">Motor</text>
    <text x="1085" y="564" font-size="15">fan</text>
    <text x="1085" y="585" font-size="15">L293D</text>
  </g>

  <!-- Arrow labels -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#16191d" font-size="15">
    <text x="870" y="310" text-anchor="middle">strikes</text>
    <text x="932" y="222">REST · websockets</text>
    <text x="607" y="415">websocket · STOPWORK</text>
