<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">OmniRisk architecture</title>
  <desc id="d">A FastAPI backend on Vultr (Docker and Caddy) pulls public data (Open-Meteo, NWS, FEMA, iNaturalist), stores conditions and events in TimescaleDB on Tiger Data, scores a 0 to 10 LightGBM hazard index with three SHAP reasons, and has Gemini (Briefings) write the 6 PM briefings in English and Spanish and tag hazard photos. A React web app (dashboard, Hub, crew phone page) talks to it over REST and websockets. On site, the beacon is a Raspberry Pi 5 gateway that reads an RP2040 sensor pod over USB serial, drives an Arduino UNO beacon head (LCD, countdown, 29-LED gauge) over serial, and holds the equipment fan motor on GPIO 18 through an L293D driver, enforcing its rules offline. Lightning strike path: the Roblox twin posts each strike to the backend, the backend sends STOPWORK to the gateway over a websocket, and the gateway pulls GPIO 18 low to stop the motor. Accent bars mark the hazard index, the briefings, the gateway, the sensor pod and the beacon head software, which are Chris's part.</desc>
