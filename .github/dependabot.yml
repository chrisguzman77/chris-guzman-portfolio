version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      web-minor: { update-types: [minor, patch] }
    ignore:
      # runtime is Node 24; bump with the base image
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      api-minor: { update-types: [minor, patch] }
  # Base-image majors (Node 24→26, Python 3.12→3.14) are upgraded by hand:
  # they can break a stage Dependabot cannot see (e.g. the uv builder's Python).
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /infra/runner
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /infra/backup
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Dependabot reads every compose*.y(a)ml in the directory (compose.yaml and
  # compose.dev.yaml), keeping tag and digest. It cannot see image tags in
  # .github/workflows or the supercronic ARG in infra/backup/Dockerfile; the
  # infra CI job runs scripts/check-image-drift.sh to catch those drifting.
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
