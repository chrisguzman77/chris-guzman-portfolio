name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'scripts/**'
              - 'apps/*/Dockerfile'
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - '.sops.yaml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Build image (catches Dockerfile and base-image breakage)
        working-directory: .
        run: docker build --build-arg NEXT_PUBLIC_APP_VERSION=ci -t ci-web apps/web

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      API_DATABASE_URL: postgresql+asyncpg://portfolio:portfolio@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - name: Build image (catches Dockerfile and base-image breakage)
        working-directory: .
        run: docker build -t ci-api apps/api

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fallback Worker and CMS bootstrap tests
        run: node --test infra/cloudflare/worker-fallback.test.mjs infra/directus/lib.test.mjs
      - name: Validate compose files
        run: |
          docker compose -f infra/compose/compose.dev.yaml config -q
          docker compose -f infra/compose/compose.yaml --env-file infra/compose/prod.env.example config -q
      - name: Shared image tags agree (prod compose, dev compose, CI)
        run: scripts/check-image-drift.sh
      - name: Prometheus and blackbox configs
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/observability/blackbox:/etc/blackbox:ro" \
            prom/blackbox-exporter:v0.28.0 --config.file=/etc/blackbox/blackbox.yml --config.check
      - name: Grafana provisioning and dashboards parse
        run: |
          yq() { docker run --rm -i -v "$PWD:/w" -w /w mikefarah/yq:4.54.1 "$@"; }
          for f in infra/observability/grafana/provisioning/*/*.yml; do
            yq -e '.apiVersion == 1' "$f" >/dev/null || { echo "bad provisioning file: $f"; exit 1; }
          done
          rules="$(yq '[.groups[].rules[]] | length' infra/observability/grafana/provisioning/alerting/rules.yml)"
          [[ "${rules}" == 8 ]] || { echo "expected 8 alert rules, found ${rules}"; exit 1; }
          # Grafana expands $VAR in every provisioning file; the only intended use is ${CONTACT_TO}.
          if grep -n '\$' infra/observability/grafana/provisioning/*/*.yml | grep -v '\${CONTACT_TO}'; then
            echo "provisioning files must not contain a dollar sign (Grafana expands it as an env var)"; exit 1
          fi
          for f in infra/observability/grafana/dashboards/*.json; do
            jq -e '(.uid | type == "string") and (.panels | length > 0)' "$f" >/dev/null || { echo "bad dashboard: $f"; exit 1; }
          done
          echo "grafana provisioning ok"
      - name: No plaintext env files committed
        run: git ls-files -z '*.env' '.env*' '**/.env*' | xargs -0 -r scripts/check-no-plaintext-env.sh
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          dockerfile: "**/Dockerfile"
      - name: Build runner image
        run: docker build -t ci-runner infra/runner
      - name: Backup round trip (backup.sh, restore.sh, verify.sql)
        run: infra/backup/test-roundtrip.sh
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          ignore_paths: node_modules .venv
