[project]
name = "portfolio-api"
version = "0.1.0"
description = "Interactions and intelligence API for the portfolio site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.53",
  "pydantic[email]>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.0.54",
  "asyncpg>=0.31",
  "alembic>=1.20",
  "structlog>=26.1",
  "httpx>=0.28",
  "fastembed>=0.8",
  "pgvector>=0.4",
  "pypdf>=6",
  "pyyaml>=6.0.2",
  "prometheus-client>=0.26.0",
]

[project.scripts]
portfolio-api = "portfolio_api.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
  "pyright>=1.1.414",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
