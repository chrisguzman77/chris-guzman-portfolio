# The thirteen alerts (Phase 6/7, the newsletter and chat quality). Each Prometheus rule is an
# instant PromQL query (A) and a threshold (C) on it; the chat-eval rules are a SQL query on
# the chat-readonly Postgres datasource (A, one numeric column) and a threshold (C). Grafana
# expands environment variables in provisioning files, so no expression, query or template
# here may contain a dollar sign (CI checks).
#
# noDataState: Alerting for Site down, Backup stale and Chat eval stale (silence there is
# itself a problem; Backup stale already maps an absent metric to a huge age, and Chat eval
# stale's query always returns a row per kind), OK for the rest (an empty result means no
# traffic yet or the condition is not met, and a missing exporter is caught by Container
# down). execErrState: Error, so a dead Prometheus or database raises one grouped
# DatasourceError email. The chat-eval rules carry component: chat-eval, which policies.yml
# routes to weekly reminders (they read a weekly run); DatasourceError and DatasourceNoData stay at 4 hours.
apiVersion: 1

groups:
  - orgId: 1
    name: portfolio
    folder: Portfolio
    interval: 1m
    rules:
      - uid: disk-filling
        title: Disk filling
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/", fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="rootfs"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Root filesystem on the VM is more than 80% full.
        labels:
          severity: warning

      - uid: memory-tight
        title: Memory tight
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: VM memory use is above 90%. Check per-container memory on the Host and containers dashboard.
        labels:
          severity: warning

      - uid: site-down
        title: Site down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: probe_success{job="site"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # probe_success is 0 or 1, so "< 1" is "== 0".
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: The public probe of https://christopherguzman.me/api/healthz is failing.
        labels:
          severity: critical

      - uid: api-errors
        title: API errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 5xx share over 5 minutes, only when there were at least 20 requests.
              expr: (sum(increase(http_requests_total{status=~"5.."}[5m])) or vector(0)) / sum(increase(http_requests_total[5m])) and on() sum(increase(http_requests_total[5m])) >= 20
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: More than 5% of API requests are returning 5xx.
        labels:
          severity: critical

      - uid: container-down
        title: Container down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 1 per broken target or container, 0 per healthy one. max_over_time
              # keeps a container's last-seen time after cAdvisor stops reporting it.
              # The 24 h lookback is deliberate: a removed container's series goes
              # stale in minutes, and the lookback is what keeps "Down" firing for
              # a day so a crashed-and-removed container cannot silently resolve.
              expr: (up == bool 0) or (time() - max by (name) (max_over_time(container_last_seen{name=~"portfolio-(postgres|directus|api|web|cloudflared|umami)-1"}[24h])) > bool 60)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Down: {{ index .Labels "job" }}{{ index .Labels "name" }}'
        labels:
          severity: critical

      - uid: backup-stale
        title: Backup stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Seconds since the last successful backup; absent metric counts as never.
              expr: (time() - max(backup_last_success_timestamp_seconds)) or vector(1e12)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 36 hours
                - evaluator: { type: gt, params: [129600] }
        noDataState: Alerting
        execErrState: Error
        for: 15m
        annotations:
          summary: No successful backup in the last 36 hours (or the backup metric is missing).
        labels:
          severity: critical

      - uid: chat-budget
        title: Chat budget
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(chat_budget_used_ratio)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: The chat has used more than 80% of today's Groq token budget.
        labels:
          severity: warning

      - uid: runner-offline
        title: Runner offline
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Seconds since cAdvisor last saw the runner container; absent for the
              # whole 24 h window counts as offline (vector(1e12)), like Backup stale.
              expr: (time() - max(max_over_time(container_last_seen{name=~"portfolio-runner-1"}[24h]))) or vector(1e12)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 15 minutes
                - evaluator: { type: gt, params: [900] }
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: The deploy runner container has not been seen for 15 minutes; deploys will queue. See the runbook.
        labels:
          severity: warning

      - uid: newsletter-send-failed
        title: Newsletter send failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(newsletter_emails_total{kind="post", result="failed"}[15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Some newsletter emails were not sent (often Resend's daily limit of 100). Open the post in Directus and click Email to subscribers again, today or tomorrow; it only emails people who have not got it.
        labels:
          severity: warning

      - uid: chat-eval-answer-low
        title: Chat eval answer low
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: chat-readonly
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: SELECT answer_pass_rate FROM chat_eval_runs WHERE kind = 'answer' AND answer_pass_rate IS NOT NULL ORDER BY started_at DESC LIMIT 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.85] }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: The latest weekly chat answer eval passed fewer than 85% of its answerable cases. See Grafana → Chat quality and the runbook (Chat quality).
        labels:
          severity: warning
          component: chat-eval

      - uid: chat-eval-refusal
        title: Chat eval refusal
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: chat-readonly
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: SELECT refusal_pass_rate FROM chat_eval_runs WHERE kind = 'answer' AND refusal_pass_rate IS NOT NULL ORDER BY started_at DESC LIMIT 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A refusal case failed in the latest chat answer eval (the chat answered something it should refuse). See Grafana → Chat quality and the runbook (Chat quality).
        labels:
          severity: warning
          component: chat-eval

      - uid: chat-eval-redteam
        title: Chat eval red-team
        condition: C
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: chat-readonly
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              # Failed cases in the latest redteam run that are not marked known (an item without
              # the flag counts as not known). Always one row: 0 when there is no run yet.
              rawSql: SELECT count(*)::float8 AS failures FROM (SELECT failures FROM chat_eval_runs WHERE kind = 'redteam' ORDER BY started_at DESC LIMIT 1) AS latest CROSS JOIN LATERAL jsonb_array_elements(latest.failures) AS f WHERE NOT COALESCE((f ->> 'known')::boolean, false)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A red-team case that is not a known failure failed in the latest chat red-team eval. See Grafana → Chat quality and the runbook (Chat quality).
        labels:
          severity: warning
          component: chat-eval

      - uid: chat-eval-stale
        title: Chat eval stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: chat-readonly
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              # Hours since the last run of each kind; a kind with no run at all counts as
              # 1,000,000 hours, so the query always returns one row per kind.
              rawSql: SELECT k.kind, COALESCE(EXTRACT(EPOCH FROM now() - max(r.started_at)) / 3600, 1000000)::float8 AS hours FROM (VALUES ('answer'), ('redteam')) AS k(kind) LEFT JOIN chat_eval_runs AS r ON r.kind::text = k.kind GROUP BY k.kind
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 9 days
                - evaluator: { type: gt, params: [216] }
        noDataState: Alerting
        execErrState: Error
        for: 1h
        annotations:
          summary: 'No {{ index .Labels "kind" }} chat eval recorded in 9 days. Check Actions → chat-eval; see the runbook (Chat quality).'
        labels:
          severity: warning
          component: chat-eval
