# Production stack on the Proxmox VM (4 GiB RAM). No service publishes a host
# port: the only way in is the Cloudflare Tunnel, which reaches services by name
# on this network. Deployed by scripts/deploy.sh.
name: portfolio

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *service
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DIRECTUS_DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 768m

  directus:
    <<: *service
    image: directus/directus:12.4.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SECRET: ${DIRECTUS_SECRET:?}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?}
      PUBLIC_URL: https://cms.christopherguzman.me
      WEBSOCKETS_ENABLED: "false"
      TELEMETRY: "false"
      DIRECTUS_WEB_TOKEN: ${DIRECTUS_WEB_TOKEN:?}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      # Phase 5, optional: api-reader token and the reindex Flow step's secret.
      DIRECTUS_API_TOKEN: ${DIRECTUS_API_TOKEN:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    volumes:
      - directus-uploads:/directus/uploads
      - ../directus:/directus/bootstrap:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8055/server/ping"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  api:
    <<: *service
    image: ghcr.io/chrisguzman77/chris-guzman-portfolio/api:${IMAGE_TAG:?}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      API_APP_VERSION: ${IMAGE_TAG:?}
      API_DATABASE_URL: postgresql+asyncpg://portfolio:${PORTFOLIO_DB_PASSWORD:?}@postgres:5432/portfolio
      API_CORS_ORIGINS: '["https://christopherguzman.me","https://www.christopherguzman.me"]'
      # Phase 4: optional until Chris's secrets PR; empty means the feature is off.
      API_TURNSTILE_SECRET: ${TURNSTILE_SECRET_KEY:-}
      API_RESEND_API_KEY: ${RESEND_API_KEY:-}
      API_CONTACT_TO: ${CONTACT_TO:-}
      API_GITHUB_TOKEN: ${GITHUB_ACTIVITY_TOKEN:-}
      # Phase 5: chat stays off until the Groq key, Directus token and salt are set.
      API_GROQ_API_KEY: ${GROQ_API_KEY:-}
      API_DIRECTUS_URL: http://directus:8055
      API_DIRECTUS_TOKEN: ${DIRECTUS_API_TOKEN:-}
      API_INTERNAL_SECRET: ${INTERNAL_API_SECRET:-}
      API_CHAT_HASH_SALT: ${CHAT_HASH_SALT:-}
    mem_limit: 768m # embedding model (~300 MB resident) for the chat index

  web:
    <<: *service
    image: ghcr.io/chrisguzman77/chris-guzman-portfolio/web:${IMAGE_TAG:?}
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_WEB_TOKEN:?}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      API_INTERNAL_URL: http://api:8000
      SITE_URL: https://christopherguzman.me
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      PUBLIC_API_URL: https://api.christopherguzman.me
      # Phase 6: analytics stays off until the Umami website exists.
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    mem_limit: 384m

  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    depends_on: [web, api, directus]
    mem_limit: 128m

  # --- Phase 6: monitoring and analytics. Private: Grafana and Umami are
  # reached only through the tunnel behind Cloudflare Access; the rest are
  # scraped by Prometheus over this network. Alert rules live in Grafana.
  prometheus:
    <<: *service
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - prometheus-data:/prometheus
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 320m

  grafana:
    <<: *service
    image: grafana/grafana:13.2.3
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Applied only when grafana-data is first created; later changes go
      # through `grafana cli admin reset-admin-password` (see the runbook).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: https://grafana.christopherguzman.me
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.resend.com:465
      GF_SMTP_USER: resend
      GF_SMTP_PASSWORD: ${RESEND_API_KEY:?}
      GF_SMTP_FROM_ADDRESS: alerts@christopherguzman.me
      GF_SMTP_FROM_NAME: Portfolio alerts
      # Read by provisioning/alerting/contact-points.yml.
      CONTACT_TO: ${CONTACT_TO:?}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 30s
    # Not 192m: Grafana 13 needs ~330 MiB (heap + its 485 MB binary in page
    # cache) or startup stalls for minutes and deploy --wait times out.
    mem_limit: 384m

  node-exporter:
    <<: *service
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - node-textfile:/textfile:ro
    mem_limit: 64m

  # Mounts follow cAdvisor's documented Docker setup. /var/run carries the
  # Docker socket, so like the runner this is root-equivalent on the VM.
  cadvisor:
    <<: *service
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      # Only what the dashboards and alerts use; container_last_seen and the
      # container_spec_* series are always exported.
      - --enable_metrics=cpu,memory,network,diskIO
      - --store_container_labels=false
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 128m

  blackbox-exporter:
    <<: *service
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 32m

  umami:
    <<: *service
    image: ghcr.io/umami-software/umami:3.4.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s
    mem_limit: 256m

  # Ephemeral deploy runner. Never listed in scripts/deploy.sh's default
  # services, so a deploy cannot restart it mid-job. The Docker socket makes it
  # root-equivalent on this VM (see docs/adr/0006-runner-in-compose.md).
  runner:
    <<: *service
    image: ghcr.io/chrisguzman77/chris-guzman-portfolio/runner:${RUNNER_TAG:-latest}
    environment:
      GITHUB_RUNNER_TOKEN: ${GITHUB_RUNNER_TOKEN:?}
      GITHUB_RUNNER_REPO: ${GITHUB_RUNNER_REPO:-chrisguzman77/chris-guzman-portfolio}
    group_add: ["${DOCKER_GID:?}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out, so relative bind mounts in this file resolve on the host.
      - /opt/portfolio:/opt/portfolio
      - /etc/portfolio/age.key:/etc/portfolio/age.key:ro
    mem_limit: 768m

volumes:
  postgres-data:
  directus-uploads:
  prometheus-data:
  grafana-data:
  node-textfile:
