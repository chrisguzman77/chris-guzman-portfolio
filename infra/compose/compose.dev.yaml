name: portfolio-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DIRECTUS_DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-directus}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:-portfolio}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  directus:
    image: directus/directus:12.4.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET:-dev-only-secret-change-me-0123456789}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-directus}
      PUBLIC_URL: http://localhost:8055
      WEBSOCKETS_ENABLED: "false"
      DIRECTUS_WEB_TOKEN: ${DIRECTUS_WEB_TOKEN:-dev-web-token}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
      DIRECTUS_API_TOKEN: ${DIRECTUS_API_TOKEN:-dev-api-token}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret}
    volumes:
      - directus-uploads:/directus/uploads
      - ../directus:/directus/bootstrap:ro
    ports:
      - "127.0.0.1:${DIRECTUS_PORT:-8055}:8055"

  api:
    build: ../../apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_DATABASE_URL: postgresql+asyncpg://portfolio:${PORTFOLIO_DB_PASSWORD:-portfolio}@postgres:5432/portfolio
      API_CORS_ORIGINS: '["http://localhost:3000"]'
      # Cloudflare's published Turnstile test secret: every token passes.
      API_TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      API_CONTACT_TO: ${CONTACT_TO:-dev@example.com}
      API_RESEND_API_KEY: ${RESEND_API_KEY:-}
      API_GITHUB_TOKEN: ${GITHUB_ACTIVITY_TOKEN:-}
      API_DIRECTUS_URL: http://directus:8055
      API_DIRECTUS_TOKEN: ${DIRECTUS_API_TOKEN:-dev-api-token}
      API_INTERNAL_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret}
      API_CHAT_HASH_SALT: dev-chat-salt
      # Empty unless exported in your shell: chat answers stay off in dev without a Groq key.
      API_GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build: ../../apps/web
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_WEB_TOKEN:-dev-web-token}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
      API_INTERNAL_URL: http://api:8000
      SITE_URL: http://localhost:3000
      # Cloudflare's published Turnstile test site key (always passes).
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  # Opt-in: `docker compose -f infra/compose/compose.dev.yaml --profile monitoring up -d prometheus blackbox-exporter`.
  # Reuses the production scrape config, so only the api and site jobs are up in dev.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    profiles: [monitoring]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

volumes:
  postgres-data:
  directus-uploads:
